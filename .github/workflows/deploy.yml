name: deploy

# KIEDY się uruchamia:
on:
  push:
    branches: [main]     # każdy push do main
  workflow_dispatch:     # + ręczny przycisk "Run workflow" w zakładce Actions

jobs:
  deploy:
    runs-on: ubuntu-latest   # darmowa maszyna z Linuksem, wynajęta od GitHuba
    steps:
      # 1. Klucz prywatny z Secretu trafia do pliku na runnerze.
      #    Bez chmod 600 ssh odmówi jego użycia (pamiętasz "UNPROTECTED PRIVATE KEY").
      - name: Zapisz klucz SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_omega
          chmod 600 ~/.ssh/deploy_omega

      # 2. Odcisk palca VPS-a do known_hosts — inaczej ssh odmówi
      #    połączenia z "nieznanym" serwerem. -H zapisuje odcisk w formie
      #    zahaszowanej (standard).
      - name: Zaufaj VPS (known_hosts)
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # 3. Właściwy deploy. && = każda kolejna komenda tylko, gdy poprzednia
      #    się udała; gdy coś padnie, ssh zwróci błąd i workflow czerwone.
      - name: Deploy na VPS
        run: |
          ssh -i ~/.ssh/deploy_omega -o BatchMode=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'cd ~/omega-invoce-pipeline && git pull && docker compose up -d --build && docker image prune -f && docker compose ps'
