# Omega Faktury — serwer na VPS (lub lokalnie).
#
#   docker compose up -d            # start panelu (http://localhost:5000)
#                                   # + monitoringu (monitor, patrz niżej)
#   docker compose run --rm cykl    # jednorazowo: nowe PDF-y + eksport XML
#   docker compose run --rm straznik  # raport dzienny (crontab o 20:00)
#   docker compose logs -f panel    # podgląd logów
#   docker compose down             # stop (dane w ./data przeżywają)
#
# Serwisy "cykl" i "straznik" mają profiles, więc NIE startują razem
# z "up" — to narzędzia uruchamiane ręcznie. Volume ./data (PDF-y, baza
# SQLite) i ./przetworzone (eksport XML + PDF-y) współdzielone.
services:
  panel:
    build: .
    image: omega-faktury
    restart: unless-stopped      # wstaje samo po restarcie maszyny
    env_file: .env               # GEMINI_API_KEY — tylko tu, nigdy w obrazie
    environment:
      - BEZ_PRZEGLADARKI=1       # w kontenerze nie ma przeglądarki
      - PANEL_HOST=0.0.0.0       # Flask ma słuchać też spoza kontenera
    volumes:
      - ./data:/app/data
      - ./przetworzone:/app/przetworzone
    ports:
      - "5000:5000"
    logging:
      driver: json-file          # rotacja logów, żeby nie zjadły dysku
      options: { max-size: "10m", max-file: "3" }

  cykl:
    image: omega-faktury         # ten sam obraz (buduje go serwis panel)
    profiles: ["narzedzia"]      # uruchamiany tylko ręcznie (run --rm)
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./przetworzone:/app/przetworzone
    # Kolejność celowa: gdy weryfikator padnie (brak klucza/PDF-ów wychodzi
    # z niezerowym kodem), && nie dopuści do eksportu. Do XML trafiają
    # faktury bez błędów walidacji; ręcznie zatwierdzone eksportuje
    # księgowa z panelu (dostają tam status "wyeksportowane").
    command: sh -c "python weryfikator.py && python eksport.py do_zatwierdzenia"

  # Monitoring — znak życia co 15 min (dead man's switch). Monitor
  # odpytuje panel od zewnątrz tak jak przeglądarka księgowej; ping do
  # Healthchecks.io idzie TYLKO po udanej odpowiedzi, więc zawieszony
  # panel = cisza = mail z Healthchecks (okno ustawiasz w jego UI).
  monitor:
    image: omega-faktury
    restart: unless-stopped
    command: python monitor.py    # bez tego wystartowałby panel (domyślne CMD)
    env_file: .env
    environment:
      - MONITOR_URL=http://panel:5000
    depends_on:
      - panel

  # Strażnik dzienny (raport + alerty) — uruchamiany crontabem hosta:
  #   0 20 * * * cd /sciezka/do/projektu && docker compose run --rm straznik
  # Alerty progowe pinguje jako /fail (natychmiastowy mail z Healthchecks).
  straznik:
    image: omega-faktury
    profiles: ["narzedzia"]
    command: python straznik.py   # bez tego wystartowałby panel (domyślne CMD)
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logi:/app/logi
