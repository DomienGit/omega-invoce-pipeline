# Omega Faktury — serwer na VPS (lub lokalnie).
#
#   docker compose up -d            # start: panel + caddy (https, port 443)
#                                   # + monitoringu (monitor, patrz niżej)
#   docker compose run --rm straznik  # raport dzienny (crontab o 20:00)
#   docker compose logs -f panel    # podgląd logów
#   docker compose down             # stop (dane w ./data przeżywają)
#
# Serwis "straznik" ma profiles, więc NIE startuje razem z "up" —
# to narzędzie uruchamiane ręcznie. Volume ./data (PDF-y, baza
# SQLite) i ./przetworzone (eksport XML + PDF-y) współdzielone.
services:
  panel:
    build: .
    image: omega-faktury
    restart: unless-stopped      # wstaje samo po restarcie maszyny
    env_file: .env               # GEMINI_API_KEY — tylko tu, nigdy w obrazie
    environment:
      - BEZ_PRZEGLADARKI=1       # w kontenerze nie ma przeglądarki
      - PANEL_HOST=0.0.0.0       # Flask ma słuchać w sieci compose
      - PANEL_ZA_PROXY=1         # włącza ProxyFix (IP klienta od Caddy)
    volumes:
      - ./data:/app/data
      - ./przetworzone:/app/przetworzone
    # celowo BEZ "ports" — z zewnątrz panel jest osiągalny wyłącznie
    # przez caddy (https, port 443); port 5000 istnieje tylko w sieci
    # compose (monitor odpyta go po imieniu serwisu)
    logging:
      driver: json-file          # rotacja logów, żeby nie zjadły dysku
      options: { max-size: "10m", max-file: "3" }

  # Jedyny wystawiony na świat port: 443. Caddy kończy TLS (certyfikat
  # samopisany "tls internal" — bez domeny) i proxyuje do panelu.
  # Wymaga ADRES_VPS w .env (patrz Caddyfile). Certyfikaty trzymają się
  # w nazwanym volume — bez tego każdy restart to nowy certyfikat
  # i ostrzeżenie przeglądarki od nowa.
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      - ADRES_VPS=${ADRES_VPS}
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - dane_caddy:/data
      - konfig_caddy:/config
    depends_on:
      - panel
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Monitoring — znak życia co 15 min (dead man's switch). Monitor
  # odpytuje panel od zewnątrz tak jak przeglądarka księgowej; ping do
  # Healthchecks.io idzie TYLKO po udanej odpowiedzi, więc zawieszony
  # panel = cisza = mail z Healthchecks (okno ustawiasz w jego UI).
  monitor:
    image: omega-faktury
    restart: unless-stopped
    command: python monitor.py    # bez tego wystartowałby panel (domyślne CMD)
    env_file: .env
    environment:
      - MONITOR_URL=http://panel:5000
    depends_on:
      - panel
    # obraz dziedziczy HEALTHCHECK panelu (probe :5000) — w kontenerze
    # monitora nic nie nasłuchuje i byłby wiecznie "unhealthy"; życiem
    # monitora zajmuje się Healthchecks.io (brak pingów = alert):
    healthcheck:
      disable: true

  # Strażnik dzienny (raport + alerty) — uruchamiany crontabem hosta:
  #   0 20 * * * cd /sciezka/do/projektu && docker compose run --rm straznik
  # Alerty progowe pinguje jako /fail (natychmiastowy mail z Healthchecks).
  straznik:
    image: omega-faktury
    profiles: ["narzedzia"]
    command: python straznik.py   # bez tego wystartowałby panel (domyślne CMD)
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logi:/app/logi

# Certyfikaty/wewnętrzny stan Caddy — nazwane volumeny, żeby nie były
# w katalogu projektu (Caddy pisze jako root wewnątrz kontenera):
volumes:
  dane_caddy:
  konfig_caddy:
