[project]
name = "omega-invoce-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "google-genai>=2.29.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
desktop = [
    "webview-python>=1.1.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# generator.py (plik testowy, poza Dockerem) używa jeszcze pillow i reportlab,
# a desktop.py pywebview — celowo poza zależnościami głównymi (grupa
# "desktop" zawiera webview-python; patrz uwaga w raporcie/README).
# pytest jest w grupie dev, więc "pip install ." w Dockerfile go nie bierze.
